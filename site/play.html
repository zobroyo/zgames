<!doctype html>
<html lang="en" class="play">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Playing &mdash; Z Games</title>
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b1012">
  <script>
  /* Drop any stale mirrored-game service workers + caches before the game
     iframe navigates: old C3 offline caches could otherwise keep serving a
     broken build forever. Exposed as a promise so app.js can wait for the
     cleanup before setting the iframe src (unregister is not instant). */
  window.__zgSwCleanup = (function () {
    var jobs = [];
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) {
            try { return r.unregister(); } catch (e) { return null; }
          }));
        }).catch(function () {}));
      }
      if (window.caches && caches.keys) {
        jobs.push(caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) {
            try { return caches.delete(k); } catch (e) { return null; }
          }));
        }).catch(function () {}));
      }
    } catch (e) {}
    var all = Promise.all(jobs);
    /* never delay the game for more than 5s (unregister can be slow) */
    return Promise.race([all, new Promise(function (res) { setTimeout(res, 5000); })]);
  })();
  </script>
  <link rel="stylesheet" href="/styles.css?v=__V__">
</head>
<body data-page="play" class="play-body">
  <header class="play-bar">
    <a class="back-link" href="/" aria-label="Back to all games">
      <span aria-hidden="true">&larr;</span>
      <span class="back-label">All games</span>
    </a>
    <h1 id="playTitle" class="play-title">Loading&hellip;</h1>
    <div class="play-actions">
      <button id="fullscreenBtn" class="btn btn-ghost btn-small" type="button">Fullscreen</button>
      <div id="account" class="account" aria-live="polite"></div>
    </div>
  </header>

  <main class="play-stage">
    <div id="frameWrap" class="frame-wrap">
      <iframe id="gameFrame" class="game-frame" title="Game"
              allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write; encrypted-media"
              allowfullscreen referrerpolicy="no-referrer"></iframe>

      <div id="modeBadge" class="mode-badge" hidden></div>

      <div id="loadOverlay" class="load-overlay" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <p id="loadText" class="load-text">Loading&hellip;</p>
        <p id="loadSub" class="load-sub" hidden>Still loading&hellip; this can take a moment.</p>
      </div>

      <div id="loadError" class="state-panel panel-overlay" hidden>
        <p class="state-title">Couldn&rsquo;t load the game list</p>
        <p class="state-sub">The catalog didn&rsquo;t answer. Make sure the server is running, then try again.</p>
        <button id="retryBtn" class="btn btn-primary" type="button">Retry</button>
      </div>
    </div>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
