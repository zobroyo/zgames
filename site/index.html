<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Z Games</title>
  <meta name="description" content="Z Games — a self-hosted game portal. Every game is mirrored on this server; nothing loads from the internet.">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="index">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Z Games home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.5 7h11a4.5 4.5 0 0 1 4.4 3.6l1 5A3 3 0 0 1 20 19a3 3 0 0 1-2.6-1.5L16 15H8l-1.4 2.5A3 3 0 0 1 4 19a3 3 0 0 1-2.9-3.4l1-5A4.5 4.5 0 0 1 6.5 7Z"/>
            <path d="M8 9.5v3M6.5 11h3"/>
            <circle cx="16.5" cy="10.5" r=".7" fill="currentColor" stroke="none"/>
            <circle cx="18.6" cy="12.6" r=".7" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span class="brand-name">Z GAMES</span>
      </a>

      <div class="search-wrap">
        <label class="visually-hidden" for="search">Search games</label>
        <input id="search" class="search-input" type="search" placeholder="Search games&hellip;"
               autocomplete="off" spellcheck="false">
      </div>

      <div class="header-right">
        <span id="gameCount" class="game-count" aria-live="polite"></span>
        <div id="account" class="account" aria-live="polite"></div>
      </div>
    </div>
  </header>

  <main class="page">
    <h1 class="visually-hidden">Game library</h1>
    <p id="status" class="catalog-status" hidden></p>
    <section id="grid" class="game-grid" aria-busy="true"></section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
